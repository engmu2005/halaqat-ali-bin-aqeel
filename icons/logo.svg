    <rect x="198" y="278" width="9" height="18" rx="3.5"/>
    <rect x="217" y="278" width="9" height="18" rx="3.5"/>
    <rect x="236" y="278" width="9" height="18" rx="3.5"/>
    <rect x="255" y="278" width="9" height="18" rx="3.5"/>
